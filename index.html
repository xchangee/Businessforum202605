<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>好未来业务论坛</title>
  <style>
    :root {
      color-scheme: light;
      --surface: rgba(255, 255, 255, 0.38);
      --text: #2b2f36;
      --radius: clamp(28px, 4vw, 56px);
      --page-gap: calc(clamp(44px, 8vmin, 96px) + 50px);
      --stroke: clamp(1px, 0.175vw, 2.5px);
      --tal-blue: #0052d9;
      --blue: #3c82ff;
      --cyan: #41d8ff;
      --purple: #8e6cff;
      --orange: #ffad5b;
      --ink: #12213f;
      --muted: #66758f;
      --line: rgba(49, 99, 187, 0.14);
      --stage-padding-block: var(--page-gap);
      --stage-padding-bottom: calc(var(--stage-padding-block) + var(--console-overhang));
      --stage-padding-inline: var(--page-gap);
      --console-overhang: clamp(40px, 5.6vh, 58px);
      --poster-offset-x: 50px;
      --poster-scale: 1.2;
      --copy-offset-x: 100px;
      --copy-offset-y: -2%;
      --system-offset-x: -70px;
      --system-offset-y: -50px;
      --slogan-width: clamp(320px, 27vw, 560px);
      --slogan-bottom: clamp(24px, 4.2vh, 48px);
      --edge-fill:
        radial-gradient(92% 78% at 18% 86%, rgba(54, 199, 132, 0.82), transparent 62%),
        radial-gradient(84% 72% at 88% 86%, rgba(203, 92, 236, 0.78), transparent 64%),
        radial-gradient(82% 72% at 84% 20%, rgba(255, 118, 83, 0.74), transparent 66%),
        radial-gradient(82% 72% at 48% 4%, rgba(255, 216, 83, 0.72), transparent 62%),
        radial-gradient(76% 74% at 12% 42%, rgba(88, 151, 246, 0.84), transparent 64%),
        linear-gradient(135deg, #7cc8ff 0%, #f0db87 33%, #f06f5f 58%, #cc6dff 78%, #7dd890 100%);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--edge-fill);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: Google Sans, Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--edge-fill);
      color: var(--text);
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      min-height: 320px;
      padding:
        var(--stage-padding-block)
        var(--stage-padding-inline)
        var(--stage-padding-bottom);
      overflow: hidden;
      isolation: isolate;
      contain: layout paint style;
      background: var(--edge-fill);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: -2px;
      z-index: 0;
      background: var(--edge-fill);
      transform: translateZ(0) scale(1.02);
      transform-origin: center;
      pointer-events: none;
      will-change: transform;
    }

    .diffuse-frame {
      position: absolute;
      inset: -2px;
      z-index: 1;
      width: calc(100% + 4px);
      height: calc(100% + 4px);
      object-fit: cover;
      background: var(--edge-fill);
      transform: translateZ(0) scaleX(1.28) scaleY(1.22);
      transform-origin: center;
      pointer-events: none;
      user-select: none;
      backface-visibility: hidden;
      will-change: transform;
    }

    .upgrade-card {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      min-height: 220px;
      border-radius: var(--radius);
      background: transparent;
      isolation: isolate;
      contain: layout style;
      container-type: size;
    }

    .upgrade-card::before {
      content: none;
    }

    .upgrade-card::after {
      content: none;
      position: absolute;
      inset: 0;
      padding: var(--stroke);
      border-radius: inherit;
      background: #ffffff;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask-composite: exclude;
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      animation: border-flow 6.5s linear infinite;
      z-index: 4;
      pointer-events: none;
    }

    .bottom-slogan {
      position: absolute;
      left: 50%;
      bottom: var(--slogan-bottom);
      z-index: 3;
      display: grid;
      place-items: center;
      width: var(--slogan-width);
      max-width: calc(100vw - 48px);
      transform: translateX(-50%);
      pointer-events: none;
      user-select: none;
    }

    .bottom-slogan img {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 100%;
      height: auto;
      opacity: 1;
    }

    .card-content {
      position: absolute;
      inset: var(--stroke);
      z-index: 1;
      overflow: hidden;
      border-radius: calc(var(--radius) - 2px);
      border: 1px solid rgba(255, 255, 255, 0.78);
      background:
        radial-gradient(92% 130% at 14% 0%, rgba(255, 255, 255, 0.74), transparent 60%),
        radial-gradient(104% 116% at 100% 100%, rgba(65, 216, 255, 0.32), transparent 58%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.7), var(--surface));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.86),
        inset 0 -1px 0 rgba(255, 255, 255, 0.18),
        0 30px 76px rgba(24, 37, 67, 0.1);
      backdrop-filter: blur(44px) saturate(1.55) contrast(1.03);
      -webkit-backdrop-filter: blur(44px) saturate(1.55) contrast(1.03);
      contain: layout paint style;
      container-type: size;
      transform: translateZ(0);
      backface-visibility: hidden;
      will-change: transform;
    }

    .card-content::before {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: 0;
      border-radius: inherit;
      background:
        linear-gradient(124deg, rgba(255, 255, 255, 0.62), transparent 28%, rgba(255, 255, 255, 0.3) 58%, transparent 76%),
        radial-gradient(80% 52% at 50% 0%, rgba(255, 255, 255, 0.52), transparent 66%);
      opacity: 0.9;
      pointer-events: none;
      transform: translateZ(0);
    }

    .mac-window-controls {
      position: absolute;
      top: clamp(18px, 2.1cqw, 30px);
      left: clamp(18px, 2.1cqw, 30px);
      z-index: 8;
      display: flex;
      align-items: center;
      gap: clamp(7px, 0.78cqw, 11px);
      padding: 4px;
      pointer-events: auto;
    }

    .mac-window-control {
      --control-color: #ff5f57;
      --control-edge: #e0443e;
      --control-glyph: rgba(111, 24, 22, 0.82);
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(11px, 1.38cqw, 19px);
      aspect-ratio: 1;
      padding: 0;
      border: 1px solid color-mix(in srgb, var(--control-edge) 72%, #000 8%);
      border-radius: 999px;
      background: var(--control-color);
      box-shadow:
        0 1px 1px rgba(255, 255, 255, 0.55),
        0 6px 12px rgba(19, 36, 67, 0.12);
      cursor: default;
      appearance: none;
      -webkit-appearance: none;
      transition:
        filter 140ms ease,
        transform 140ms ease,
        box-shadow 140ms ease;
    }

    .mac-window-control::before,
    .mac-window-control::after {
      content: "";
      position: absolute;
      opacity: 0;
      transition: opacity 120ms ease;
      pointer-events: none;
    }

    .mac-window-controls:hover .mac-window-control::before,
    .mac-window-controls:hover .mac-window-control::after,
    .mac-window-control:focus-visible::before,
    .mac-window-control:focus-visible::after {
      opacity: 1;
    }

    .mac-window-control:hover {
      filter: saturate(1.08) brightness(1.03);
      transform: translateY(-1px);
      box-shadow:
        0 1px 1px rgba(255, 255, 255, 0.6),
        0 8px 14px rgba(19, 36, 67, 0.15);
    }

    .mac-window-control:active {
      filter: saturate(0.98) brightness(0.94);
      transform: translateY(0) scale(0.94);
      box-shadow:
        inset 0 1px 3px rgba(0, 0, 0, 0.18),
        0 1px 1px rgba(255, 255, 255, 0.42),
        0 3px 8px rgba(19, 36, 67, 0.1);
    }

    .mac-window-control:focus-visible {
      outline: 2px solid rgba(0, 82, 217, 0.35);
      outline-offset: 3px;
    }

    .music-player {
      position: absolute;
      top: clamp(18px, 2.1cqw, 30px);
      right: clamp(18px, 2.1cqw, 30px);
      z-index: 9;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: min(260px, calc(100% - 116px));
      min-height: clamp(28px, 3.8cqh, 38px);
      padding: 0 clamp(10px, 1.25cqw, 16px);
      border: 1px solid rgba(18, 33, 63, 0.11);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.44);
      color: rgba(18, 33, 63, 0.74);
      font: inherit;
      font-size: clamp(10px, 0.9cqw, 14px);
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.86),
        0 12px 26px rgba(24, 37, 67, 0.08);
      backdrop-filter: blur(20px) saturate(1.35);
      -webkit-backdrop-filter: blur(20px) saturate(1.35);
      transition:
        border-color 180ms ease,
        background 180ms ease,
        color 180ms ease,
        box-shadow 180ms ease,
        transform 180ms ease;
    }

    .music-player::before {
      content: "";
      width: 6px;
      aspect-ratio: 1;
      flex: 0 0 auto;
      border-radius: 999px;
      background: rgba(102, 117, 143, 0.5);
      box-shadow: 0 0 0 3px rgba(102, 117, 143, 0.08);
      transition:
        background 180ms ease,
        box-shadow 180ms ease,
        transform 180ms ease;
    }

    .music-player:hover,
    .music-player:focus-visible {
      color: rgba(18, 33, 63, 0.9);
      background: rgba(255, 255, 255, 0.62);
      border-color: rgba(0, 82, 217, 0.22);
      transform: translateY(-1px);
    }

    .music-player:focus-visible {
      outline: 2px solid rgba(0, 82, 217, 0.3);
      outline-offset: 3px;
    }

    .music-player:active {
      transform: translateY(0) scale(0.98);
    }

    .music-player.is-playing {
      border-color: rgba(65, 216, 255, 0.28);
      background: rgba(255, 255, 255, 0.5);
      color: rgba(0, 82, 217, 0.82);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.92),
        0 14px 30px rgba(0, 82, 217, 0.1);
    }

    .music-player.is-playing::before {
      background: #41d8ff;
      box-shadow:
        0 0 0 3px rgba(65, 216, 255, 0.12),
        0 0 14px rgba(65, 216, 255, 0.78);
      animation: music-pulse 1.7s ease-in-out infinite;
      will-change: opacity, transform;
    }

    .music-player__label {
      color: currentColor;
      font-size: 0.88em;
      text-transform: uppercase;
    }

    .music-player__track {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mac-close::before,
    .mac-close::after {
      width: 52%;
      height: 1.5px;
      border-radius: 999px;
      background: var(--control-glyph);
      transform: rotate(45deg);
    }

    .mac-close::after {
      transform: rotate(-45deg);
    }

    .mac-minimize {
      --control-color: #ffbd2e;
      --control-edge: #dfa123;
      --control-glyph: rgba(125, 83, 8, 0.78);
    }

    .mac-minimize::before {
      width: 52%;
      height: 1.5px;
      border-radius: 999px;
      background: var(--control-glyph);
    }

    .mac-zoom {
      --control-color: #28c840;
      --control-edge: #1aaa35;
      --control-glyph: rgba(12, 91, 30, 0.78);
    }

    .mac-zoom::before {
      width: 43%;
      height: 43%;
      border-top: 1.5px solid var(--control-glyph);
      border-left: 1.5px solid var(--control-glyph);
      transform: translate(-8%, -8%);
    }

    .mac-zoom::after {
      width: 43%;
      height: 43%;
      border-right: 1.5px solid var(--control-glyph);
      border-bottom: 1.5px solid var(--control-glyph);
      transform: translate(8%, 8%);
    }

    .forum-poster {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(78% 110% at 76% 12%, rgba(245, 252, 255, 0.18), transparent 58%),
        radial-gradient(64% 92% at 100% 88%, rgba(255, 219, 96, 0.14), transparent 70%),
        linear-gradient(90deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.2) 52%, rgba(255, 255, 255, 0.12));
      color: var(--ink);
      isolation: isolate;
      contain: layout paint style;
      container-type: size;
      backdrop-filter: blur(32px) saturate(1.45);
      -webkit-backdrop-filter: blur(32px) saturate(1.45);
      transform: translate3d(var(--poster-offset-x), 0, 0) scale(var(--poster-scale));
      transform-origin: center center;
      will-change: transform;
      backface-visibility: hidden;
    }

    .forum-poster::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: radial-gradient(circle at 61% 44%, #000 0 48%, transparent 75%);
      opacity: 0.72;
      transform: translateZ(0);
    }

    .forum-poster::after {
      content: "";
      position: absolute;
      inset: -40%;
      z-index: 1;
      background:
        linear-gradient(100deg, transparent 34%, rgba(65, 216, 255, 0.16) 45%, rgba(255, 255, 255, 0.36) 51%, transparent 62%),
        radial-gradient(circle at 62% 48%, rgba(65, 216, 255, 0.16), transparent 20%);
      transform: translateX(-28%);
      animation: light-sweep 8s ease-in-out infinite;
      pointer-events: none;
      backface-visibility: hidden;
      will-change: transform;
    }

    .forum-particles {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      mask-image: linear-gradient(90deg, transparent, #000 24%, #000 88%, transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 24%, #000 88%, transparent);
      opacity: 0.52;
    }

    .forum-particles::before,
    .forum-particles::after {
      content: "";
      position: absolute;
      pointer-events: none;
      will-change: transform;
      backface-visibility: hidden;
    }

    .forum-particles::before {
      inset: -72px;
      background-image: radial-gradient(circle, rgba(0, 82, 217, 0.36) 0 1.5px, transparent 1.8px);
      background-size: 72px 72px;
      background-position: 7px 19px;
      animation: particle-drift-primary 18s linear infinite;
    }

    .forum-particles::after {
      inset: -108px;
      background-image: radial-gradient(circle, rgba(65, 216, 255, 0.32) 0 1.2px, transparent 1.6px);
      background-size: 108px 108px;
      background-position: 41px 33px;
      animation: particle-drift-secondary 18s linear infinite;
    }

    .forum-content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: clamp(34px, 8.7cqh, 96px) clamp(32px, 7.2cqw, 112px) clamp(80px, 13.4cqh, 140px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 0.96fr);
      gap: clamp(24px, 4.6cqw, 72px);
      align-items: center;
    }

    .forum-copy {
      min-width: 0;
      max-width: 100%;
      transform: translateX(var(--copy-offset-x)) translateY(var(--copy-offset-y));
    }

    .forum-year {
      margin: 0 0 3.4%;
      color: rgba(0, 82, 217, 0.78);
      font-size: clamp(12px, 1.04vw, 20px);
      font-weight: 800;
      letter-spacing: 0.24em;
    }

    .forum-title {
      margin: 0;
      max-width: 760px;
      font-size: clamp(36px, 6.2cqw, 104px);
      line-height: 1.04;
      font-weight: 900;
      letter-spacing: 0;
      color: #132443;
      text-wrap: balance;
      overflow-wrap: anywhere;
    }

    .forum-title span {
      display: block;
    }

    .forum-title .forum-title-main {
      font-size: 1.2em;
      font-weight: 950;
    }

    .forum-subtitle {
      margin: 4.2% 0 0;
      max-width: min(100%, 34em);
      font-size: clamp(14px, 1.6cqw, 26px);
      line-height: 1.25;
      height: 1.25em;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: rgba(18, 33, 63, 0.72);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
      overflow-wrap: normal;
    }

    .ai-greeting__prefix {
      white-space: nowrap;
    }

    .ai-greeting__cursor {
      display: inline-block;
      width: 0.08em;
      height: 0.9em;
      margin-left: 0.12em;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0.36em currentColor;
      opacity: 0.6;
      transform: translateY(0.08em);
      transform-origin: center;
      animation: cursor-breathe 1.18s ease-in-out infinite;
      will-change: transform;
    }

    .forum-accent-line {
      display: none;
      width: 42%;
      height: 6px;
      margin-top: 7.2%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--tal-blue), var(--cyan), var(--orange));
      box-shadow: 0 0 28px rgba(65, 216, 255, 0.42);
    }

    .forum-system {
      position: relative;
      aspect-ratio: 1.05;
      width: min(100%, 68cqh);
      min-height: 0;
      justify-self: center;
      transform: translateX(var(--system-offset-x)) translateY(var(--system-offset-y));
    }

    .forum-glass-card {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 22px;
      background:
        linear-gradient(150deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.24) 58%, rgba(255, 255, 255, 0.18));
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.72),
        0 22px 55px rgba(38, 78, 156, 0.11);
    }

    .forum-metric {
      left: 1%;
      top: calc(7% + 40px);
      width: 36%;
      padding: 20px;
    }

    .forum-metric small,
    .forum-module small {
      display: block;
      color: var(--muted);
      font-size: clamp(10px, 0.73vw, 14px);
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .forum-metric strong {
      display: block;
      margin-top: 10px;
      color: var(--tal-blue);
      font-size: clamp(28px, 3.13vw, 60px);
      line-height: 1;
      font-weight: 900;
    }

    .forum-bars {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .forum-bars span {
      height: 7px;
      border-radius: 99px;
      background: linear-gradient(90deg, rgba(0, 82, 217, 0.78), rgba(65, 216, 255, 0.32));
    }

    .forum-bars span:nth-child(2) {
      width: 72%;
    }

    .forum-bars span:nth-child(3) {
      width: 48%;
    }

    .forum-chip {
      position: absolute;
      left: 25%;
      top: calc(21% + 40px);
      width: 45%;
      aspect-ratio: 1;
      border-radius: 32px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.58), rgba(236,246,255,0.34)) padding-box,
        linear-gradient(135deg, rgba(65,216,255,0.5), rgba(142,108,255,0.5), rgba(255,173,91,0.5)) border-box;
      border: 2px solid transparent;
      box-shadow:
        0 0 70px rgba(65, 216, 255, 0.22),
        inset 0 0 28px rgba(0, 82, 217, 0.08);
      display: grid;
      place-items: center;
    }

    .forum-chip::before,
    .forum-chip::after {
      content: "";
      position: absolute;
      inset: 16%;
      border: 1px solid rgba(0, 82, 217, 0.18);
      border-radius: 22px;
    }

    .forum-chip::after {
      inset: 29%;
      background:
        radial-gradient(circle at center, rgba(0, 82, 217, 0.11), transparent 54%),
        linear-gradient(90deg, transparent 48%, rgba(0, 82, 217, 0.22) 49% 51%, transparent 52%),
        linear-gradient(0deg, transparent 48%, rgba(0, 82, 217, 0.22) 49% 51%, transparent 52%);
    }

    .forum-chip-logo {
      position: relative;
      z-index: 2;
      width: 36.8%;
      height: auto;
      filter: drop-shadow(0 14px 24px rgba(0, 82, 217, 0.16));
      animation: logo-breathe 2.8s ease-in-out infinite;
      transform-origin: center;
      will-change: transform;
    }

    .forum-pin {
      position: absolute;
      width: 8px;
      height: 32px;
      border-radius: 99px;
      background: linear-gradient(var(--cyan), rgba(0, 82, 217, 0.28));
      opacity: 0.58;
    }

    .forum-pin:nth-child(1) {
      left: 18%;
      top: -18px;
    }

    .forum-pin:nth-child(2) {
      right: 18%;
      top: -18px;
    }

    .forum-pin:nth-child(3) {
      left: 18%;
      bottom: -18px;
    }

    .forum-pin:nth-child(4) {
      right: 18%;
      bottom: -18px;
    }

    .forum-network {
      position: absolute;
      inset: 2% 0 0 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .forum-network path {
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 7 13;
      animation: dash-flow 8s linear infinite;
      will-change: stroke-dashoffset;
    }

    .forum-network circle {
      filter: drop-shadow(0 0 10px rgba(65, 216, 255, 0.65));
      animation: blink 3.2s ease-in-out infinite;
      transform-origin: center;
      will-change: opacity, transform;
    }

    .forum-module {

    <script>
    (() => {
      const tracks = [
        {
          title: "小河淌水",
          src: "media/music/xiaohe-tangshui.mp3",
        },
        {
          title: "在那遥远的地方",
          src: "media/music/zai-na-yaoyuan-de-difang.mp3",
        },
      ];
      const audio = document.querySelector("[data-music-audio]");
      const toggle = document.querySelector("[data-music-toggle]");
      const trackLabel = document.querySelector("[data-music-track]");

      if (!audio || !toggle || !trackLabel) {
        return;
      }

      let currentTrackIndex = 0;
      let wantsPlayback = false;
      let removePlaybackUnlock = () => {};

      function getCurrentTrack() {
        return tracks[currentTrackIndex];
      }

      function updateToggle(isPlaying) {
        const track = getCurrentTrack();
        toggle.classList.toggle("is-playing", isPlaying);
        toggle.setAttribute("aria-pressed", String(isPlaying));
        toggle.setAttribute("aria-label", `${isPlaying ? "暂停" : "播放"}背景音乐：${track.title}`);
        trackLabel.textContent = track.title;
      }

      function setTrack(index, shouldLoad = true) {
        currentTrackIndex = (index + tracks.length) % tracks.length;

        if (shouldLoad) {
          audio.src = getCurrentTrack().src;
          audio.load();
        }

        updateToggle(!audio.paused);
      }

      function ensureSource() {
        if (!audio.getAttribute("src")) {
          audio.src = getCurrentTrack().src;
          audio.load();
        }
      }

      function clearPlaybackUnlock() {
        removePlaybackUnlock();
        removePlaybackUnlock = () => {};
      }

      function schedulePlaybackUnlock() {
        clearPlaybackUnlock();

        const retryPlayback = () => {
          clearPlaybackUnlock();
          playMusic();
        };

        document.addEventListener("pointerdown", retryPlayback, { once: true, passive: true });
        document.addEventListener("touchstart", retryPlayback, { once: true, passive: true });
        document.addEventListener("keydown", retryPlayback, { once: true });

        removePlaybackUnlock = () => {
          document.removeEventListener("pointerdown", retryPlayback);
          document.removeEventListener("touchstart", retryPlayback);
          document.removeEventListener("keydown", retryPlayback);
        };
      }

      async function playMusic({ retryOnInteraction = false } = {}) {
        wantsPlayback = true;
        audio.volume = 0.72;
        ensureSource();

        try {
          await audio.play();
          clearPlaybackUnlock();
          updateToggle(true);
        } catch {
          if (retryOnInteraction) {
            schedulePlaybackUnlock();
          } else {
            wantsPlayback = false;
          }
          audio.pause();
          updateToggle(false);
        }
      }

      function pauseMusic() {
        wantsPlayback = false;
        clearPlaybackUnlock();
        audio.pause();
        updateToggle(false);
      }

      toggle.addEventListener("click", () => {
        if (audio.paused) {
          playMusic();
        } else {
          pauseMusic();
        }
      });

      audio.addEventListener("play", () => updateToggle(true));
      audio.addEventListener("pause", () => {
        if (!audio.ended) {
          updateToggle(false);
        }
      });
      audio.addEventListener("ended", () => {
        setTrack(currentTrackIndex + 1);

        if (wantsPlayback) {
          playMusic();
        }
      });
      audio.addEventListener("error", pauseMusic);

      setTrack(0, false);
      updateToggle(false);
      playMusic({ retryOnInteraction: true });
    })();

    (() => {
      const greetingText = document.querySelector("[data-greeting-text]");
      const subtitle = greetingText?.closest(".forum-subtitle");

      if (!greetingText || !subtitle) {
        return;
      }

      const rawNames = Array.isArray(window.forumAttendeeNames) ? window.forumAttendeeNames : [];
      const attendees = rawNames
        .map((name, index) => ({ name: normalizeAttendeeName(name), index }))
        .filter((attendee, index, queue) => (
          attendee.name
          && queue.findIndex((candidate) => candidate.name === attendee.name) === index
        ));
      const displayQueue = attendees.length ? attendees.slice() : [{ name: "林知远", index: 0 }];
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const fallbackBlessings = [
        "保持勇敢，让漂亮转折自然发生",
        "愿你今天在专注里遇见灵感",
        "灵感频道连接成功"
      ];
      const rawBlessings = Array.isArray(window.forumBlessingCopies) ? window.forumBlessingCopies : [];
      const blessingCopies = Array.from(new Set(rawBlessings.map(normalizeBlessing).filter(Boolean)));
      const displayBlessings = blessingCopies.length ? blessingCopies : fallbackBlessings;
      const attendeeBlessings = assignBlessings(displayQueue, displayBlessings);

      function getRandomIndex(max) {
        if (window.crypto?.getRandomValues) {
          const value = new Uint32Array(1);
          window.crypto.getRandomValues(value);
          return value[0] % max;
        }

        return Math.floor(Math.random() * max);
      }

      function shuffle(queue) {
        for (let index = queue.length - 1; index > 0; index -= 1) {
          const swapIndex = getRandomIndex(index + 1);
          [queue[index], queue[swapIndex]] = [queue[swapIndex], queue[index]];
        }
      }

      function normalizeAttendeeName(name) {
        return String(name || "").replace(/\s+/g, " ").trim();
      }

      function normalizeBlessing(copy) {
        const trimmed = String(copy || "")
          .replace(/^\s*(?:[-*]\s*)?\d+[.、]\s*/, "")
          .replace(/[。！？.!?]\s*$/, "")
          .trim();

        if (!trimmed) {
          return "";
        }

        return trimmed;
      }

      function buildBlessingPool(count, baseCopies) {
        if (!baseCopies.length) {
          return [];
        }

        const pool = [];

        while (pool.length < count) {
          pool.push(...baseCopies);
        }

        return pool.slice(0, count);
      }

      function assignBlessings(queue, baseCopies) {
        const pool = buildBlessingPool(queue.length, baseCopies);
        shuffle(pool);

        return new Map(queue.map((attendee, index) => [
          attendee.index,
          pool[index] || fallbackBlessings[index % fallbackBlessings.length]
        ]));
      }

      function buildGreeting(attendee) {
        return {
          text: `${attendee.name}老师丨${attendeeBlessings.get(attendee.index) || fallbackBlessings[0]}`,
        };
      }

      function shuffleDisplayQueue(previousAttendee) {
        shuffle(displayQueue);

        if (displayQueue.length <= 1 || !previousAttendee || displayQueue[0]?.name !== previousAttendee.name) {
          return;
        }

        const swapIndex = displayQueue.findIndex((attendee, index) => (
          index > 0 && attendee.name !== previousAttendee.name
        ));

        if (swapIndex > 0) {
          [displayQueue[0], displayQueue[swapIndex]] = [displayQueue[swapIndex], displayQueue[0]];
        }
      }

      function fitGreetingLine() {
        subtitle.style.fontSize = "";

        const availableWidth = subtitle.clientWidth;
        const requiredWidth = subtitle.scrollWidth;

        if (!availableWidth || requiredWidth <= availableWidth) {
          return;
        }

        const currentSize = Number.parseFloat(window.getComputedStyle(subtitle).fontSize);
        const fittedSize = Math.max(9, currentSize * (availableWidth / requiredWidth));
        subtitle.style.fontSize = `${fittedSize}px`;
      }

      let greetingFitFrame = 0;

      function scheduleFitGreetingLine() {
        if (greetingFitFrame) {
          return;
        }

        greetingFitFrame = window.requestAnimationFrame(() => {
          greetingFitFrame = 0;
          fitGreetingLine();
        });
      }

      function fitGreetingLineForText(text) {
        const currentText = greetingText.textContent;
        const currentVisibility = greetingText.style.visibility;

        greetingText.style.visibility = "hidden";
        greetingText.textContent = text;
        fitGreetingLine();

        greetingText.textContent = currentText;
        greetingText.style.visibility = currentVisibility;
      }

      function wait(duration) {
        return new Promise((resolve) => window.setTimeout(resolve, duration));
      }

      async function typeLine(text) {
        fitGreetingLineForText(text);
        greetingText.textContent = "";

        if (prefersReducedMotion) {
          greetingText.textContent = text;
          return;
        }

        let typedText = "";
        for (const char of Array.from(text)) {
          typedText += char;
          greetingText.textContent = typedText;
          await wait(26);
        }
      }

      let queueIndex = 0;
      let lastDisplayedAttendee = null;
      let greetingLoopActive = true;
      shuffleDisplayQueue();

      async function runGreetingLoop() {
        while (greetingLoopActive) {
          if (queueIndex >= displayQueue.length) {
            shuffleDisplayQueue(lastDisplayedAttendee);
            queueIndex = 0;
          }

          const greeting = buildGreeting(displayQueue[queueIndex]);
          lastDisplayedAttendee = displayQueue[queueIndex];
          queueIndex += 1;

          await typeLine(greeting.text);
          await wait(prefersReducedMotion ? 3200 : 2300);
        }
      }

      window.addEventListener("pagehide", () => {
        greetingLoopActive = false;
      }, { once: true });
      window.addEventListener("resize", scheduleFitGreetingLine);
      runGreetingLoop();
    })();

    (() => {
      const consoleEl = document.querySelector(".mock-console");
      const triggers = Array.from(document.querySelectorAll("[data-menu-trigger]"));
      const menus = Array.from(document.querySelectorAll(".mock-menu"));

      if (!consoleEl || triggers.length === 0 || menus.length === 0) {
        return;
      }

      const triggerForMenu = (menu) => triggers.find((trigger) => trigger.dataset.menuTrigger === menu.id);

      function setHostOpen(trigger, isOpen) {
        const host = trigger.closest(".mock-select-host");
        if (!host) {
          return;
        }

        if (isOpen) {
          host.dataset.open = "true";
        } else {
          delete host.dataset.open;
        }
      }

      function placeMenu(trigger, menu) {
        const gap = Number(menu.dataset.gap || 10);
        const consoleRect = consoleEl.getBoundingClientRect();
        const triggerRect = trigger.getBoundingClientRect();
        const menuRect = menu.getBoundingClientRect();
        const scaleX = consoleEl.offsetWidth ? consoleRect.width / consoleEl.offsetWidth : 1;
        const scaleY = consoleEl.offsetHeight ? consoleRect.height / consoleEl.offsetHeight : 1;
        const localScaleX = scaleX || 1;
        const localScaleY = scaleY || 1;
        const menuWidth = menuRect.width / localScaleX;
        const menuHeight = menuRect.height / localScaleY;
        const align = menu.dataset.align || "center";
        const placement = menu.dataset.placement || "top";
        let left = (triggerRect.left - consoleRect.left) / localScaleX;

        if (align === "right") {
          left = (triggerRect.right - consoleRect.left) / localScaleX - menuWidth;
        } else if (align === "center") {
          left = (triggerRect.left - consoleRect.left) / localScaleX + (triggerRect.width / localScaleX - menuWidth) / 2;
        }

        const minLeft = (-consoleRect.left + 8) / localScaleX;
        const maxLeft = (window.innerWidth - consoleRect.left - 8) / localScaleX - menuWidth;
        left = Math.max(minLeft, Math.min(left, maxLeft));

        let top = placement === "bottom"
          ? (triggerRect.bottom - consoleRect.top) / localScaleY + gap
          : (triggerRect.top - consoleRect.top) / localScaleY - menuHeight - gap;

        const minTop = (-consoleRect.top + 8) / localScaleY;
        const maxTop = (window.innerHeight - consoleRect.top - 8) / localScaleY - menuHeight;
        top = Math.max(minTop, Math.min(top, maxTop));

        menu.style.left = `${left}px`;
        menu.style.top = `${top}px`;
        menu.style.setProperty("--menu-origin", "top left");
      }

      function closeMenu(menu) {
        const trigger = triggerForMenu(menu);
        menu.classList.remove("is-open");
        window.clearTimeout(Number(menu.dataset.closeTimer || 0));
        menu.dataset.closeTimer = String(window.setTimeout(() => {
          if (!menu.classList.contains("is-open")) {
            menu.hidden = true;
          }
        }, 160));

        if (trigger) {
          trigger.setAttribute("aria-expanded", "false");
          setHostOpen(trigger, false);
        }
      }

      function closeAll(exceptMenu) {
        menus.forEach((menu) => {
          if (menu !== exceptMenu && !menu.hidden) {
            closeMenu(menu);
          }
        });
      }

      function openMenu(trigger, menu) {
        closeAll(menu);
        window.clearTimeout(Number(menu.dataset.closeTimer || 0));
        menu.hidden = false;
        trigger.setAttribute("aria-expanded", "true");
        setHostOpen(trigger, true);
        requestAnimationFrame(() => {
          placeMenu(trigger, menu);
          menu.classList.add("is-open");
        });
      }

      let menuPlacementFrame = 0;

      function placeOpenMenus() {
        menuPlacementFrame = 0;

        menus.forEach((menu) => {
          if (menu.classList.contains("is-open")) {
            const trigger = triggerForMenu(menu);
            if (trigger) {
              placeMenu(trigger, menu);
            }
          }
        });
      }

      function scheduleMenuPlacement() {
        if (menuPlacementFrame) {
          return;
        }

        menuPlacementFrame = window.requestAnimationFrame(placeOpenMenus);
      }

      function toggleMenu(trigger) {
        const menu = document.getElementById(trigger.dataset.menuTrigger);
        if (!menu) {
          return;
        }

        if (menu.classList.contains("is-open")) {
          closeMenu(menu);
        } else {
          openMenu(trigger, menu);
        }
      }

      function updateSelectedRow(menu, row) {
        const groupRows = Array.from(menu.querySelectorAll('[role="menuitemradio"]'));
        if (row.getAttribute("role") === "menuitemradio") {
          groupRows.forEach((item) => item.setAttribute("aria-checked", String(item === row)));
        }

        const label = row.dataset.label;
        const trigger = triggerForMenu(menu);
        const triggerLabel = trigger?.querySelector("[data-trigger-label]");

        if (label && triggerLabel) {
          triggerLabel.textContent = label;
        }

        if (trigger && menu.id === "permission-menu") {
          trigger.classList.toggle("mock-control-active", label === "完全访问权限");
        }
      }

      triggers.forEach((trigger) => {
        trigger.addEventListener("click", () => toggleMenu(trigger));
      });

      menus.forEach((menu) => {
        menu.addEventListener("click", (event) => {
          const row = event.target.closest(".mock-menu-row");

          if (!row || row.disabled) {
            return;
          }

          updateSelectedRow(menu, row);

          if (row.getAttribute("role") !== "menuitem" || row.dataset.label) {
            closeMenu(menu);
          }
        });

        menu.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            closeMenu(menu);
            triggerForMenu(menu)?.focus();
          }
        });
      });

      document.addEventListener("click", (event) => {
        if (event.target.closest(".mock-menu, [data-menu-trigger]")) {
          return;
        }

        closeAll();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeAll();
        }
      });

      window.addEventListener("resize", scheduleMenuPlacement);
    })();
  </script>
</body>
